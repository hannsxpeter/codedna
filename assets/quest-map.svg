    <text x="24" y="96" class="sans" font-size="28" font-weight="700" fill="#EDEDE6">Map</text>
    <text x="24" y="124" class="sans" font-size="14" fill="#A5A397">Scout the repo. Write the profile.</text>
    <line x1="24" y1="144" x2="316" y2="144" stroke="#34312B"/>
    <text x="24" y="172" class="mono" font-size="11" fill="#A5A397" letter-spacing="1.5">CLEAR IT WITH</text>
    <text x="24" y="200" class="mono" font-size="15" font-weight="700" fill="#EDEDE6">build the codedna</text>
    <text x="24" y="224" class="mono" font-size="15" font-weight="700" fill="#EDEDE6">codedna_stats.py</text>
    <line x1="24" y1="244" x2="316" y2="244" stroke="#34312B"/>
    <text x="24" y="268" class="sans" font-size="13" fill="#A5A397">Reward: CODEDNA.md + wiring</text>
    <rect x="252" y="24" width="64" height="22" rx="3" fill="#6BB8F2"/>
    <text x="284" y="39" class="mono" font-size="12" font-weight="700" fill="#1B1916" text-anchor="middle" letter-spacing="1.5">START</text>
  </g>

  <g transform="translate(430 84)">
    <rect width="340" height="280" rx="4" fill="#23211D" stroke="#34312B"/>
