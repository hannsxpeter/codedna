    <text x="24" y="96" class="sans" font-size="28" font-weight="700" fill="#EDEDE6">Match</text>
    <text x="24" y="124" class="sans" font-size="14" fill="#A5A397">Write so it sounds like the author.</text>
    <line x1="24" y1="144" x2="316" y2="144" stroke="#34312B"/>
    <text x="24" y="172" class="mono" font-size="11" fill="#A5A397" letter-spacing="1.5">CLEAR IT WITH</text>
    <text x="24" y="200" class="mono" font-size="15" font-weight="700" fill="#EDEDE6">add this in house style</text>
    <text x="24" y="224" class="mono" font-size="15" font-weight="700" fill="#EDEDE6">follow CODEDNA.md</text>
    <line x1="24" y1="244" x2="316" y2="244" stroke="#34312B"/>
    <text x="24" y="268" class="sans" font-size="13" fill="#A5A397">Reward: blended contributions</text>
  </g>

  <g transform="translate(812 84)">
    <rect width="340" height="280" rx="4" fill="#23211D" stroke="#34312B"/>
    <text x="24" y="54" class="mono" font-size="38" font-weight="700" fill="#6BB8F2">03</text>
    <text x="24" y="96" class="sans" font-size="28" font-weight="700" fill="#EDEDE6">Check</text>
    <text x="24" y="124" class="sans" font-size="14" fill="#A5A397">Boss fight: catch the impostor.</text>
