  <text x="1168" y="28" class="mono" font-size="13" fill="#A5A397" text-anchor="end">MAP TO CHECK  3 LEVELS</text>
  <path d="M220 230H980" fill="none" stroke="#6BB8F2" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round"/>

  <g transform="translate(48 84)">
