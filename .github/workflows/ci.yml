name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 3.9 is the floor because it is the python3 that ships with macOS.
        python-version: ["3.9", "3.x"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile helpers
        run: |
          python -m py_compile skill/scripts/codedna_stats.py
          python -m py_compile skill/scripts/codedna_wire.py

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Lint installer
        run: shellcheck install.sh
